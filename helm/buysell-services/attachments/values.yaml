deploymentName: attachments-deployment
serviceName: attachments
appLabel: attachments
appName: attachments

replicaCount: 1

image:
  repository: buysell/attachments
  tag: 0.0.1-SNAPSHOT

containerPort: 8081

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

appname_enabled: true
profile_enabled: true
config_enabled: true
eureka_enabled: true
resouceserver_enabled: true
otel_enabled: true
kafka_enabled: false