# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: emails-deployment
serviceName: emails
appLabel: emails
appName: emails

replicaCount: 1

image:
  repository: buysell/emails
  tag: 0.0.1-SNAPSHOT

containerPort: 8082

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

appname_enabled: true
profile_enabled: true
config_enabled: true
eureka_enabled: true
resouceserver_enabled: false
otel_enabled: true
kafka_enabled: false